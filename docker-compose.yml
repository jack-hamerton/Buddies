services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buddie
      POSTGRES_USER: buddie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - buddie-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddie -d buddie"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - buddie-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      PLAYER_LIMIT: 5000
      ALLOWED_ORIGIN: ${BUDDIE_ORIGIN:-http://localhost:3001}
      DATABASE_URL: postgres://buddie:${POSTGRES_PASSWORD:-local-development-only}@db:5432/buddie
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
volumes:
  buddie-redis:
      buddie-postgres:
